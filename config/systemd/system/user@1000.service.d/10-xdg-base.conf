# Base directories for this user's service manager.
#
# environment.d and user environment generators only fill the environment
# block passed to user services. They do not change the manager process.
# Specifiers %C %D %E %L %S are taken from the environment user@1000.service
# was started with. See systemd-user(5) and systemd issue 29414.
#
# In this system unit, %h is /root, not the home of User=. Paths are absolute.
# This drop-in applies the next time user@1000.service starts (log out or reboot).
# A user-manager reload or reexec does not re-read it.

[Service]
Environment=XDG_CONFIG_HOME=/home/vvvoytus/etc
Environment=XDG_CACHE_HOME=/home/vvvoytus/var/cache
Environment=XDG_DATA_HOME=/home/vvvoytus/var/share
Environment=XDG_STATE_HOME=/home/vvvoytus/var/state
