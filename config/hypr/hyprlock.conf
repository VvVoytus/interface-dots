source = ./themes/catppuccin-mocha.conf

$font = Monospace

general {
    hide_cursor = true # Hides the cursor instead of making it visible
    ignore_empty_input = true # Skips validation when no password is provided
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

background {
    monitor =
    path = ~/var/share/backgrounds/dark-cat.png
    blur_passes = 2
    blur_size = 3
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -250
    halign = center
    valign = center
    outline_thickness = 1
    rounding = 40 # -1 means complete rounding (circle/oval)

    hide_input = false
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below

    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

    outer_color = $rosewater
    inner_color = rgba(FFFFFF00)
    font_color = $rosewater
    check_color = $green 
    fail_color = $red # if authentication failed, changes outer_color and fail message color
    capslock_color = $red
    numlock_color = $red
    bothlock_color = $red # when both locks are active. -1 means don't change outer color (same for above)

    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.

    placeholder_text = <b>Input Password...</b> # Text rendered in the input box when it's empty.
    fail_text = <b>$FAIL</b> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color

    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $rosewater
    font_size = 180
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}
