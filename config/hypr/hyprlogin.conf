# sample hyprlogin.conf
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
#
# shortcuts:
# - ESC on an empty password field returns to username entry
# - ESC / Ctrl+U / Ctrl+Backspace clear the current field
# - Tab / Shift+Tab cycle the selected session
#
# active config path: /etc/hyprlogin/hyprlogin.conf
# if that file does not exist, hyprlogin falls back to the installed example config
#
# optional greeter defaults:
# sessions:default_user = your_username
# sessions:default_session = hyprland.desktop
#

source = ./catppuccin-mocha.conf

$font = Monospace

general {
    hide_cursor = false
    immediate_render = false
    exit_command = hyprctl eval 'hl.dispatch(hl.dsp.exit())'
    fail_timeout = 4000
    debug_mode = false
    debug_log_path = /tmp/hyprlogin-debug.log
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /usr/share/backgrounds/dark-cat.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -250
    halign = center
    valign = center
    outline_thickness = 1
    rounding = 40 # -1 means complete rounding (circle/oval)

    hide_input = false
    fade_on_empty = false

    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

    outer_color = $rosewater
    inner_color = rgba(FFFFFF00)
    font_color = $rosewater
    check_color = $green 
    fail_color = $red # if authentication failed, changes outer_color and fail message color
    capslock_color = $red
    numlock_color = $red
    bothlock_color = $red # when both locks are active. -1 means don't change outer color (same for above)

    font_family = $font
    placeholder_text = <b>Input password...</b>
    placeholder_text_username = <b>Input username...</b>
    fail_text = <b>$FAIL</b>
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color

    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $rosewater
    font_size = 180
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $GREETD_SESSION
    font_size = 16
    color = $rosewater
    font_family = $font
    onclick = hyprlogin:session_next

    position = 30, 30
    halign = left
    valign = bottom
}

# A greet message that only appears after a username is entered or set via
# sessions:default_user. See hide_when_empty below.
label {
    monitor =
    text = Login as $GREETD_USER
    font_size = 16
    font_family = $font
    color = $rosewater

    position = 0, 35
    halign = center
    valign = center

    hide_when_empty = true
}
