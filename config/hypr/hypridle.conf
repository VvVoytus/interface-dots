# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                                       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'     # to avoid having to press a key twice to turn on the display.
}

# Step 1: darken the screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 0%    # set to minimum, avoid turning off the screen completely
    on-resume = brightnessctl -r            # restore previous brightness level
}

# Step 2: lock the session after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Step 3: disable the display after 7.5 minutes of inactivity
listener {
    timeout = 450
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Step 4: suspend the system after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
